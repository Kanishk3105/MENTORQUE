name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend — install, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5001

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  backend:
    name: Backend — install, lint, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        # The recommendation-engine and CSV tests are pure-function and
        # DB-free by design (see services/embeddings.js) so they don't need
        # a live Postgres instance here.
        run: npm test

  verify-production-build:
    name: Verify production build end-to-end
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mentorque
          POSTGRES_PASSWORD: mentorque
          POSTGRES_DB: mentorque
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mentorque -d mentorque"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mentorque:mentorque@localhost:5432/mentorque
      JWT_SECRET: ci-test-secret
      PORT: 5001
      ADMIN_EMAIL: admin@mentorque.dev
      ADMIN_PASSWORD: admin1234
      SEED_PASSWORD: password123
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Push schema to the ephemeral database
        working-directory: backend
        run: npx prisma db push --skip-generate

      - name: Seed the database
        working-directory: backend
        run: npm run db:seed

      - name: Start the API in the background
        working-directory: backend
        run: nohup node src/index.js > server.log 2>&1 &

      - name: Wait for the API to become healthy
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:5001/health; then
              echo "API is up"
              exit 0
            fi
            sleep 1
          done
          echo "API did not become healthy in time"
          cat backend/server.log || true
          exit 1

      - name: Smoke test — admin login returns a token
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" -X POST http://localhost:5001/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@mentorque.dev","password":"admin1234"}')
          cat response.json
          test "$status" = "200"
          grep -q '"token"' response.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend production build against the live API URL
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5001
